name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify-ubuntu:
    name: Sanitize, Models, GLSL, Android AAR & Flutter (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow for LUT verification
        run: python3 -m pip install pillow

      - name: Run sanitization, model SHA256, topology & LUT checks
        run: |
          python3 _tooling/sanitize-check.py
          python3 _tooling/verify-models.py
          python3 reference/gen_face_topology.py --verify
          python3 reference/gen_builtin_luts.py --verify

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -n "$SDK_ROOT" && -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Run C++17 unified math & RHI RenderPipeline tests
        run: |
          cmake -S core -B /tmp/livebeauty-cpp-build
          cmake --build /tmp/livebeauty-cpp-build --parallel
          ctest --test-dir /tmp/livebeauty-cpp-build --output-on-failure

      - name: Run Android standalone unit tests & assemble Release AAR
        working-directory: android
        run: ./gradlew --no-daemon :live-beauty:testDebugUnitTest :live-beauty:testReleaseUnitTest :live-beauty:assembleRelease

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter analyze & unit tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  verify-macos:
    name: iOS/macOS CoreImage & Headless WebGL1 GLSL Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12 & Pillow
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Compile & run Objective-C CoreImage beauty test
        run: |
          CI_BIN="$(mktemp -t livebeauty_ci).bin"
          clang -fobjc-arc \
            -framework Foundation \
            -framework CoreImage \
            -framework CoreGraphics \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework QuartzCore \
            ios/Classes/FLTFaceGeometry.m \
            ios/Classes/FLTFaceGeometrySmoother.m \
            ios/Classes/FLTFaceLandmarkTracker.m \
            ios/Classes/FLTVideoEffects.m \
            ios/Tests/verify_macos_ci.m \
            -o "$CI_BIN"
          "$CI_BIN"
          rm -f "$CI_BIN"

      - name: Build & run C++17 unified core + Apple Metal GPU pixel gates
        run: |
          cmake -S core -B /tmp/livebeauty-metal-build -DLIVEBEAUTY_ENABLE_METAL=ON
          cmake --build /tmp/livebeauty-metal-build --parallel
          ctest --test-dir /tmp/livebeauty-metal-build --output-on-failure
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Wno-unused-parameter \
            -Icore/include -Icore/src/rhi/metal -Iios/Classes \
            -c ios/Classes/FLTVisionTracker.mm -o /tmp/flt_vision_tracker.o
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Wno-unused-parameter \
            -Icore/include -Icore/src/rhi/metal -Iios/Classes \
            -c ios/Classes/FLTLiveBeautyMetalEngine.mm -o /tmp/flt_metal_engine.o
          rm -f /tmp/flt_vision_tracker.o /tmp/flt_metal_engine.o

      - name: Set up Chrome for WebGL1 GLSL shader gate
        uses: browser-actions/setup-chrome@v2

      - name: Run 44-shader + 28-mutant WebGL1 GLSL gate
        run: bash _tooling/verify-glsl.sh
