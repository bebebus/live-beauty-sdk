name: live_beauty_sdk
description: >-
  Real-time GPU live beauty SDK featuring 478-pt C-infinity diffeomorphic face
  reshape, 1080p guided skin smoothing, 6-layer makeup, 64^3 3D LUT color
  grading, body reshape, and portrait bokeh for Android, iOS, and Flutter.
version: 3.6.8
homepage: https://dh.video
repository: https://github.com/bebebus/live-beauty-sdk
documentation: https://github.com/bebebus/live-beauty-sdk#readme
issue_tracker: https://github.com/bebebus/live-beauty-sdk/issues

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.bebebus.livebeauty.flutter
        pluginClass: LiveBeautySdkPlugin
      ios:
        pluginClass: LiveBeautySdkPlugin
  assets:
    - licenses/MediaPipe-LICENSE.txt
    - licenses/GPUPixel-LICENSE.txt
